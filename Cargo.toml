[package]
edition = "2021"
authors = [
  "Richard Newman <rnewman@twinql.com>",
  "Nicholas Alexander <nalexander@mozilla.com>",
  "Victor Porof <vporof@mozilla.com>",
  "Jordan Santell <jsantell@mozilla.com>",
  "Joe Walker <jwalker@mozilla.com>",
  "Emily Toop <etoop@mozilla.com>",
  "Grisha Kruglov <grigory@kruglov.ca>",
  "Kit Cambridge <kit@yakshaving.ninja>",
  "Edouard Oger <eoger@fastmail.com>",
  "Thom Chiovoloni <tchiovoloni@mozilla.com>",
  "Gregory Burd <greg@burd.me>",
]
name = "mentat"
version = "0.14.0"
build = "build/version.rs"

[features]
default = ["bundled_sqlite3"]
bundled_sqlite3 = ["rusqlite/bundled"]
sqlcipher = ["rusqlite/sqlcipher", "mentat_db/sqlcipher"]
# Optional pure-Rust mino scripting layer (exposes the `mentat.store` language).
# OFF by default: pure-Rust Mentat users pay nothing.
mino = ["dep:mino-rs"]

[workspace]
members = [
  "tools/cli",
  "ffi", "core", "core-traits","db", "db-traits", "edn", "public-traits", "query-algebrizer",
  "query-algebrizer-traits", "query-projector", "query-projector-traits","query-pull",
  "query-sql", "sql", "sql-traits", "transaction", "mino", "mino/vendor/gc", "mino/vendor/gc_derive"
  ]

[workspace.package]
# ponytail: plan §1.14 intends pinned 1.98; MSRV floor stays 1.88 (plan). The
# CI host (EC2) runs 1.90 via rustup, so rust-toolchain.toml pins 1.90.
rust-version = "1.88"

[workspace.lints.clippy]
# Panic prevention (to be promoted to deny as code is cleaned up)
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
panic_in_result_fn = "allow"
unimplemented = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
# Temporarily allowed (pre-existing, non-safety, to be fixed incrementally)
type_complexity = "allow"
needless_borrow = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
unnecessary_wraps = "allow"
manual_let_else = "allow"
single_match_else = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
get_first = "allow"
collapsible_match = "allow"
collapsible_else_if = "allow"
single_match = "allow"
cloned_ref_to_slice_refs = "allow"
unnecessary_cast = "allow"
collapsible_str_replace = "allow"
needless_range_loop = "allow"
manual_strip = "allow"
unnecessary_map_or = "allow"
useless_format = "allow"

[build-dependencies]
rustc_version = "~0.4"

[dev-dependencies]
assert_approx_eq = "~1"

#[dev-dependencies.cargo-husky]
#version = "1"
#default-features = false # Disable features which are enabled by default
#features = ["run-for-all", "precommit-hook", "run-cargo-fmt", "run-cargo-test", "run-cargo-check", "run-cargo-clippy"]
#cargo audit
#cargo outdated

[dependencies]
chrono = "~0.4"
lazy_static = "~1.5"
time = "0.3.36"
log = "~0.4"
uuid = { version = "~1.25", features = ["v4", "serde"] }

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[dependencies.edn]
path = "edn"

[dependencies.core_traits]
path = "core-traits"

[dependencies.mentat_core]
path = "core"

[dependencies.mentat_sql]
path = "sql"

[dependencies.mentat_db]
path = "db"

[dependencies.db_traits]
path = "db-traits"

[dependencies.mentat_query_algebrizer]
path = "query-algebrizer"

[dependencies.query_algebrizer_traits]
path = "query-algebrizer-traits"

[dependencies.mentat_query_projector]
path = "query-projector"

[dependencies.query_projector_traits]
path = "query-projector-traits"

[dependencies.mentat_query_pull]
path = "query-pull"

[dependencies.query_pull_traits]
path = "query-pull-traits"

[dependencies.mentat_query_sql]
path = "query-sql"

[dependencies.sql_traits]
path = "sql-traits"

[dependencies.public_traits]
path = "public-traits"

[dependencies.mentat_transaction]
path = "transaction"

# Optional: the mino Clojure-dialect interpreter, behind the `mino` feature.
# Maintained in this repo (mino/); upstream mino is archived.
[dependencies.mino-rs]
path = "mino"
optional = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
