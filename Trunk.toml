# NOTE: the Trunk registry (pgt.dev) is defunct as of 2025; this metadata is
# retained but not published. See docs/registry-publishing.md.
[extension]
name = "pg_mentat"
version = "1.11.1"
repository = "https://codeberg.org/gregburd/mentat"
license = "Apache-2.0"
description = "Datomic-compatible Datalog query engine for PostgreSQL"
homepage = "https://codeberg.org/gregburd/mentat"
documentation = "https://codeberg.org/gregburd/mentat/src/branch/master/docs"
categories = ["data-transforms", "search"]

[build]
postgres_version = "16"
pgrx_version = "0.17.0"
rust_version = "1.88.0"

# Extension installs a shared library + SQL scripts
[build.features]
pg16 = true

[build.platform_dependencies]
linux = ["libclang-dev", "clang", "build-essential", "pkg-config"]
