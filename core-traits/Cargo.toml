[package]
name = "core_traits"
version = "0.0.2"
workspace = ".."
edition = "2021"

[lib]
name = "core_traits"
path = "lib.rs"

[dependencies]
chrono = { version = "~0.4", features = ["serde"] }
enumset = "1.1"
lazy_static = "~1.5"
indexmap = "~2.14"
ordered-float = { version = "~5.0", features = ["serde"] }
uuid = { version = "~1.25", features = ["v4", "serde"] }
serde = { version = "~1.0", features = ["rc"] }
serde_derive = "~1.0"
bytes = { version = "1.8.0", features = ["serde"] }

[dependencies.edn]
path = "../edn"
features = ["serde_support"]
