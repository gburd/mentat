[package]
name = "mentat_core_traits"
description = "Core trait and type definitions shared across Mentat crates"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"

[lib]
name = "core_traits"
path = "lib.rs"

[dependencies]
chrono = { version = "~0.4", features = ["serde"] }
enumset = "1.1"
lazy_static = "~1.5"
indexmap = "~2.14"
ordered-float = { version = "5.3", features = ["serde"] }
uuid = { version = "~1.25", features = ["v4", "serde"] }
serde = { version = "~1.0", features = ["rc"] }
serde_derive = "~1.0"
bytes = { version = "1.8.0", features = ["serde"] }

[dependencies.edn]
package = "mentat_edn"
path = "../edn"
version = "=1.14.0"
features = ["serde_support"]

[lints]
workspace = true
