[package]
name = "mentat_core"
description = "Core types and helpers for Mentat (the embedded Datomic-compatible store)"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"

[dependencies]
chrono = { version = "~0.4", features = ["serde"] }
enumset = "1.1"
indexmap = "~2.14"
ordered-float = { version = "5.3", features = ["serde"] }
uuid = { version = "~1.25", features = ["v4", "serde"] }

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../core-traits"
version = "=1.17.2"

[dependencies.edn]
package = "mentat_edn"
path = "../edn"
version = "=1.17.2"
features = ["serde_support"]

[lints]
workspace = true
