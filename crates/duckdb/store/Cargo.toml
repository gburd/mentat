[package]
name = "mentat_duckdb_store"
publish = false
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "mentat's storage on DuckDB tables (the DuckDB extension's backend)"

# No duckdb dependency: this crate speaks to DuckDB through mentat_sql's
# SqlConn. `src/duck_conn.rs` (the SqlConn for duckdb::Connection) is
# #[path]-included by the extension and by `tests-harness`, which build duckdb
# with different features.

[features]
# `edn_eval`'s mino scripting surface over DuckDB stores.
script = ["dep:mino-rs", "dep:mentat_script"]

[dependencies]
core_traits = { package = "mentat_core_traits", path = "../../core-traits", version = "=1.14.0" }
db_traits = { package = "mentat_db_traits", path = "../../sqlite/db-traits", version = "=1.14.0" }
edn = { package = "mentat_edn", path = "../../edn", version = "=1.14.0" }
mentat_core = { path = "../../core", version = "=1.14.0" }
mentat_db = { path = "../../sqlite/db", version = "=1.14.0" }
mentat_query_algebrizer = { path = "../../sqlite/query-algebrizer", version = "=1.14.0" }
mentat_query_projector = { path = "../../sqlite/query-projector", version = "=1.14.0" }
mentat_query_pull = { path = "../../sqlite/query-pull", version = "=1.14.0" }
mentat_sql = { path = "../../sqlite/sql", version = "=1.14.0" }
mentat_transaction = { path = "../../sqlite/transaction", version = "=1.14.0" }
public_traits = { package = "mentat_public_traits", path = "../../sqlite/public-traits", version = "=1.14.0" }
serde_json = "1"
mino-rs = { path = "../../mino", optional = true, version = "=1.14.0" }
mentat_script = { path = "../../script", optional = true, version = "=1.14.0" }

[lints]
workspace = true
