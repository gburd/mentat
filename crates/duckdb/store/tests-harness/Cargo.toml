[package]
name = "mentat_duckdb_store_tests"
version = "0.0.0"
edition = "2021"
publish = false

# A separate workspace: it builds duckdb with `bundled` (a normal client
# library) to test mentat_duckdb_store outside DuckDB, while the extension
# builds duckdb with `loadable-extension`. Cargo unifies features per build, so
# the two can't share one. Run: cargo test --manifest-path <this file>.
[workspace]

[dependencies]
duckdb = { version = "~1.10506.0", features = ["bundled"] }
mentat_duckdb_store = { path = "..", features = ["script"], version = "=1.12.0" }
mentat_script = { path = "../../../script", version = "=1.12.0" }
mino-rs = { path = "../../../mino", version = "=1.12.0" }
mentat_query_algebrizer = { path = "../../../sqlite/query-algebrizer", version = "=1.12.0" }
mentat_query_projector = { path = "../../../sqlite/query-projector", version = "=1.12.0" }
core_traits = { package = "mentat_core_traits", path = "../../../core-traits", version = "=1.12.0" }
edn = { package = "mentat_edn", path = "../../../edn", version = "=1.12.0" }

[dev-dependencies]
# The SQLite engine, for the differential test (its own bundled SQLite).
mentat = { package = "mentatdb", path = "../../../sqlite/mentat", version = "=1.12.0" }
