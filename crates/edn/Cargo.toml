[package]
name = "mentat_edn"
version.workspace = true
authors = ["Joe Walker <jwalker@mozilla.com>"]
edition = "2021"

license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"
description = "EDN parser for Project Mentat"
readme = "./README.md"

# Package renamed to `mentat_edn` for crates.io; keep the library name `edn`
# so `use edn::` keeps working across the workspace and in this crate's tests.
[lib]
name = "edn"

[dependencies]
chrono = "~0.4"
itertools = "~0.15"
num = "~0.4"
ordered-float = "5.3"
pretty = "~0.12"
uuid = { version = "~1.25", features = ["v4", "serde"] }
serde = { version = "~1.0", optional = true }
serde_derive = { version = "~1.0", optional = true }
peg = "~0.8"
bytes = "1.8.0"
hex = "0.4.3"

[dev-dependencies]
serde_test = "~1.0"
serde_json = "~1.0"

[features]
serde_support = ["serde", "serde_derive"]

[lints]
workspace = true
