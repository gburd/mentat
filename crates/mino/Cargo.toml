[package]
name = "mino-rs"
version = "0.14.0"
edition = "2021"
description = "Pure-Rust implementation of the mino Clojure dialect (reader, evaluator, persistent collections, core.clj stdlib, EAVT store), maintained as part of Mentat."
repository = "https://codeberg.org/gregburd/mentat"
license = "MIT"

[dependencies]
# Vendored rust-gc v0.5.1 with iterative marking; see vendor/VENDORED.md.
gc = { path = "vendor/gc", features = ["derive"] }
# fancy-regex: pure-Rust regex WITH backreferences, which mino's engine
# supports (`(a+)\1`) and the `regex` crate cannot. See src/prim/regex.rs.
fancy-regex = "0.14"
# Numeric tower (Phase 5.5): arbitrary-precision int + exact rationals.
# Pure Rust, NOT a port of mino's vendored imath.
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
# UUID value type (#uuid literals): parse + canonical format only.
uuid = { workspace = true }

[dev-dependencies]
# conformance harness runs mino's own .clj corpus; no framework deps
