[package]
name = "mino_gc"
version = "0.5.1"
authors = ["Manish Goregaokar <manishsmail@gmail.com>", "Nika Layzell <nika@thelayzells.com>"]
description = "Tracing garbage collector plugin for Rust."
repository = "https://github.com/Manishearth/rust-gc"
readme = "../README.md"
license = "MPL-2.0"
keywords = ["garbage", "plugin", "memory"]
edition = "2018"

# Keep the library name `gc` (the package was renamed to `mino_gc` for
# crates.io; dependents use `gc = { package = "mino_gc", ... }`). This keeps
# `use gc::` working in this crate's own tests and in mino's source.
[lib]
name = "gc"

[features]
nightly = []
derive = ["gc_derive"]
unstable-config = []
unstable-stats = []

[dependencies]
gc_derive = { package = "mino_gc_derive", path = "../gc_derive", version = "0.5.0", optional = true }
serde = { version = "1.0.0", optional = true }

[dev-dependencies]
gc = { package = "mino_gc", path = ".", features = ["derive"] }
serde_json = { version = "1.0.66" }
