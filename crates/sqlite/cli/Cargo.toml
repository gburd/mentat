[package]
name = "mentat_cli"
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"

# Forward mentat's features.
[features]
default = ["bundled_sqlite3"]
sqlcipher = ["mentat/sqlcipher"]
bundled_sqlite3 = ["mentat/bundled_sqlite3"]
# `.eval`: the mino scripting language over the open store.
mino = ["mentat/mino"]

[lib]
name = "mentat_cli"
path = "src/mentat_cli/lib.rs"

[[bin]]
name = "mentat_cli"
doc = false
test = false

[dependencies]
anyhow = "~1.0"
thiserror = "~2.0"
combine = "~4.6"
dirs = "~6.0"
env_logger = "~0.11"
getopts = "~0.2"
lazy_static = "~1.5"
linefeed = "~0.6"
log = "~0.4"
tabwriter = "~1.4"
tempfile = "~3.27"
termion = "~4.0"
time = "~0.3"
bytes = { version = "1.8.0", features = ["serde"] }
hex = "0.4.3"
serde_json = "1"

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[dependencies.mentat]
path = "../mentat"
default-features = false

[dependencies.edn]
path = "../../edn"

[dependencies.core_traits]
path = "../../core-traits"

[dependencies.mentat_db]
path = "../db"
