[package]
name = "mentat_cli"
description = "Interactive command-line REPL for the embedded Mentat store"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"

# Forward mentat's features.
[features]
default = ["bundled_sqlite3"]
sqlcipher = ["mentat/sqlcipher"]
bundled_sqlite3 = ["mentat/bundled_sqlite3"]
# `.eval`: the mino scripting language over the open store.
mino = ["mentat/mino"]

[lib]
name = "mentat_cli"
path = "src/mentat_cli/lib.rs"

[[bin]]
name = "mentat_cli"
doc = false
test = false

[dependencies]
anyhow = "~1.0"
thiserror = "~2.0"
dirs = "~6.0"
env_logger = "~0.11"
getopts = "~0.2"
lazy_static = "~1.5"
peg = "~0.8"
linefeed = "~0.6"
log = "~0.4"
tabwriter = "~1.4"
tempfile = "~3.27"
termion = "~4.0"
time = "~0.3"
bytes = { version = "1.8.0", features = ["serde"] }
hex = "0.4.3"
serde_json = "1"

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[dependencies.mentat]
package = "mentatdb"
path = "../mentat"
version = "=1.18.0"
default-features = false

[dependencies.edn]
package = "mentat_edn"
path = "../../edn"
version = "=1.18.0"

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../../core-traits"
version = "=1.18.0"

[dependencies.mentat_db]
path = "../db"
version = "=1.18.0"
