[package]
name = "mentat_db_traits"
description = "Database-layer error and context traits for Mentat"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"

[lib]
name = "db_traits"
path = "lib.rs"

[features]
sqlcipher = ["rusqlite/sqlcipher"]

[dependencies]
thiserror = "~2.0"

[dependencies.edn]
package = "mentat_edn"
path = "../../edn"
version = "=1.14.0"

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../../core-traits"
version = "=1.14.0"

[dependencies.sql_traits]
package = "mentat_sql_traits"
path = "../sql-traits"
version = "=1.14.0"

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[lints]
workspace = true
