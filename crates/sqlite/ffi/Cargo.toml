[package]
name = "mentat_ffi"
publish = false
version = "0.0.2"
authors = ["Emily Toop <etoop@mozilla.com>"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "mentat_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["bundled_sqlite3"]
sqlcipher = ["mentat/sqlcipher"]
bundled_sqlite3 = ["mentat/bundled_sqlite3"]

[dependencies]
libc = "~0.2"

[dependencies.mentat]
package = "mentatdb"
path = "../mentat"
version = "=1.13.0"
default-features = false
