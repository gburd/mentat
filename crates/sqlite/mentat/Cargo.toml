[package]
edition.workspace = true
name = "mentatdb"
description = "A Datomic-compatible Datalog triple store on SQLite (the embedded Mentat engine; the library is `mentat`)"
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build/version.rs"

# Package renamed to `mentatdb` for crates.io; keep the library name `mentat`
# so `use mentat::` keeps working across the workspace and in this crate's
# tests, and so dependents keep `mentat = { package = "mentatdb", ... }`.
[lib]
name = "mentat"

[features]
default = ["bundled_sqlite3"]
bundled_sqlite3 = ["rusqlite/bundled"]
sqlcipher = ["rusqlite/sqlcipher", "mentat_db/sqlcipher"]
# Optional pure-Rust mino scripting layer (exposes the `mentat.store` language).
# OFF by default: pure-Rust Mentat users pay nothing.
mino = ["dep:mino-rs", "dep:mentat_script"]

[build-dependencies]
rustc_version = "~0.4"

[dev-dependencies]
assert_approx_eq = "~1"

[dependencies]
chrono = "~0.4"
lazy_static = "~1.5"
time = "0.3.36"
log = "~0.4"
serde_json = "1"
uuid = { version = "~1.25", features = ["v4", "serde"] }

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[dependencies.edn]
package = "mentat_edn"
path = "../../edn"
version = "=1.17.0"

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../../core-traits"
version = "=1.17.0"

[dependencies.mentat_core]
path = "../../core"
version = "=1.17.0"

[dependencies.mentat_sql]
path = "../sql"
version = "=1.17.0"

[dependencies.mentat_db]
path = "../db"
version = "=1.17.0"

[dependencies.db_traits]
package = "mentat_db_traits"
path = "../db-traits"
version = "=1.17.0"

[dependencies.mentat_query_algebrizer]
path = "../query-algebrizer"
version = "=1.17.0"

[dependencies.query_algebrizer_traits]
package = "mentat_query_algebrizer_traits"
path = "../query-algebrizer-traits"
version = "=1.17.0"

[dependencies.mentat_query_projector]
path = "../query-projector"
version = "=1.17.0"

[dependencies.query_projector_traits]
package = "mentat_query_projector_traits"
path = "../query-projector-traits"
version = "=1.17.0"

[dependencies.mentat_query_pull]
path = "../query-pull"
version = "=1.17.0"

[dependencies.query_pull_traits]
package = "mentat_query_pull_traits"
path = "../query-pull-traits"
version = "=1.17.0"

[dependencies.mentat_query_sql]
path = "../query-sql"
version = "=1.17.0"

[dependencies.sql_traits]
package = "mentat_sql_traits"
path = "../sql-traits"
version = "=1.17.0"

[dependencies.public_traits]
package = "mentat_public_traits"
path = "../public-traits"
version = "=1.17.0"

[dependencies.mentat_transaction]
path = "../transaction"
version = "=1.17.0"

# Optional: the mino Clojure-dialect interpreter, behind the `mino` feature.
# Maintained in this repo (crates/mino/); upstream mino is archived.
[dependencies.mino-rs]
path = "../../mino"
version = "=1.17.0"
optional = true

# Optional: the backend-independent mentat.store/* scripting glue (§ 1.19).
[dependencies.mentat_script]
path = "../../script"
version = "=1.17.0"
optional = true
