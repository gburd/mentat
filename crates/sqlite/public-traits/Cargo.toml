[package]
name = "mentat_public_traits"
description = "Public error and result types for the Mentat API"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"

[lib]
name = "public_traits"
path = "lib.rs"

[features]
sqlcipher = ["rusqlite/sqlcipher"]

[dependencies]
thiserror = "~2.0"
http = "~1.1"
tokio = { version = "1.41.0", features = ["full"] }
uuid = "~1.25"

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[dependencies.hyper]
version = "1"
optional = true

[dependencies.serde_json]
version = "~1.0"
optional = true

[dependencies.edn]
package = "mentat_edn"
path = "../../edn"
version = "=1.15.0"

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../../core-traits"
version = "=1.15.0"

[dependencies.db_traits]
package = "mentat_db_traits"
path = "../db-traits"
version = "=1.15.0"

[dependencies.query_algebrizer_traits]
package = "mentat_query_algebrizer_traits"
path = "../query-algebrizer-traits"
version = "=1.15.0"

[dependencies.query_projector_traits]
package = "mentat_query_projector_traits"
path = "../query-projector-traits"
version = "=1.15.0"

[dependencies.query_pull_traits]
package = "mentat_query_pull_traits"
path = "../query-pull-traits"
version = "=1.15.0"

[dependencies.sql_traits]
package = "mentat_sql_traits"
path = "../sql-traits"
version = "=1.15.0"
