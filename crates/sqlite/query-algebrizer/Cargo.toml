[package]
name = "mentat_query_algebrizer"
description = "Translates Mentat Datalog into an algebraic query form"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"

[dependencies]

[dependencies.edn]
package = "mentat_edn"
path = "../../edn"
version = "=1.12.0"

[dependencies.mentat_core]
path = "../../core"
version = "=1.12.0"

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../../core-traits"
version = "=1.12.0"

[dependencies.query_algebrizer_traits]
package = "mentat_query_algebrizer_traits"
path = "../query-algebrizer-traits"
version = "=1.12.0"

[dev-dependencies]
itertools = "~0.15"

[lints]
workspace = true
