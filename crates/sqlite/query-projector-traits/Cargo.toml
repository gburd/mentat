[package]
name = "mentat_query_projector_traits"
description = "Traits for projecting Mentat query results"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"

[lib]
name = "query_projector_traits"
path = "lib.rs"

[features]
sqlcipher = ["rusqlite/sqlcipher"]

[dependencies]
thiserror = "~2.0"

[dependencies.sql_traits]
package = "mentat_sql_traits"
path = "../sql-traits"
version = "=1.14.0"

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[dependencies.edn]
package = "mentat_edn"
path = "../../edn"
version = "=1.14.0"

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../../core-traits"
version = "=1.14.0"

[dependencies.db_traits]
package = "mentat_db_traits"
path = "../db-traits"
version = "=1.14.0"

[dependencies.query_pull_traits]
package = "mentat_query_pull_traits"
path = "../query-pull-traits"
version = "=1.14.0"

[dependencies.mentat_query_algebrizer]
path = "../query-algebrizer"
version = "=1.14.0"

[dependencies.mentat_query_sql]
path = "../query-sql"
version = "=1.14.0"

[dev-dependencies.mentat_core]
path = "../../core"
version = "=1.14.0"

[dev-dependencies.mentat_query_projector]
path = "../query-projector"
# No version: this is a circular dev-dependency (projector depends on this
# crate at build time; this crate uses projector only in its own tests).
# cargo publish strips path-only dev-deps without checking the index, which
# breaks the publish cycle. See the publish runbook.

[lints]
workspace = true
