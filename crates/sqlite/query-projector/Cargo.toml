[package]
name = "mentat_query_projector"
description = "Projects SQL rows back into Mentat query results"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"

[features]
sqlcipher = ["rusqlite/sqlcipher"]

[dependencies]
indexmap = "~2.14"

[dependencies.mentat_sql]
path = "../sql"
version = "=1.17.0"

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../../core-traits"
version = "=1.17.0"

[dependencies.edn]
package = "mentat_edn"
path = "../../edn"
version = "=1.17.0"

[dependencies.mentat_core]
path = "../../core"
version = "=1.17.0"

[dependencies.mentat_db]
path = "../db"
version = "=1.17.0"

[dependencies.db_traits]
package = "mentat_db_traits"
path = "../db-traits"
version = "=1.17.0"

[dependencies.mentat_query_algebrizer]
path = "../query-algebrizer"
version = "=1.17.0"

[dependencies.mentat_query_pull]
path = "../query-pull"
version = "=1.17.0"

[dependencies.query_pull_traits]
package = "mentat_query_pull_traits"
path = "../query-pull-traits"
version = "=1.17.0"

[dependencies.query_projector_traits]
package = "mentat_query_projector_traits"
path = "../query-projector-traits"
version = "=1.17.0"

[dependencies.mentat_query_sql]
path = "../query-sql"
version = "=1.17.0"


[lints]
workspace = true
