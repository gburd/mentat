[package]
name = "mentat_query_sql"
description = "Turns Mentat's algebrized queries into SQL"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[dependencies.edn]
package = "mentat_edn"
path = "../../edn"
version = "=1.12.0"

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../../core-traits"
version = "=1.12.0"

[dependencies.mentat_core]
path = "../../core"
version = "=1.12.0"

[dependencies.mentat_sql]
path = "../sql"
version = "=1.12.0"

[dependencies.sql_traits]
package = "mentat_sql_traits"
path = "../sql-traits"
version = "=1.12.0"

[dependencies.mentat_query_algebrizer]
path = "../query-algebrizer"
version = "=1.12.0"
