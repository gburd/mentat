[package]
name = "mentat_sql"
description = "SQL building and value conversion for Mentat"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
repository = "https://codeberg.org/gregburd/mentat"

[features]
sqlcipher = ["rusqlite/sqlcipher"]

[dependencies]
ordered-float = "5.3"

[dependencies.rusqlite]
version = "~0.40"
features = ["limits", "bundled"]

[dependencies.core_traits]
package = "mentat_core_traits"
path = "../../core-traits"
version = "=1.12.0"

[dependencies.mentat_core]
path = "../../core"
version = "=1.12.0"

[dependencies.sql_traits]
package = "mentat_sql_traits"
path = "../sql-traits"
version = "=1.12.0"
