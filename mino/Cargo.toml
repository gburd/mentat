[package]
name = "mino-rs"
version = "0.0.0"
edition = "2021"
description = "Pure-Rust port of the mino Clojure-dialect interpreter (reader, evaluator, persistent collections, core.clj stdlib, EAVT store). Reused by Mentat and pg_mentat."
license = "MIT"

[dependencies]
gc = { version = "0.5", features = ["derive"] }
# fancy-regex: pure-Rust regex WITH backreferences, which mino's engine
# supports (`(a+)\1`) and the `regex` crate cannot. See src/prim/regex.rs.
fancy-regex = "0.14"

[dev-dependencies]
# conformance harness runs mino's own .clj corpus; no framework deps
