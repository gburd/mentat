[package]
name = "tolstoy_traits"
version = "0.0.2"
workspace = ".."

[lib]
name = "tolstoy_traits"
path = "lib.rs"

[features]
sqlcipher = ["rusqlite/sqlcipher"]

[dependencies]
failure = "~0.1"
failure_derive = "~0.1"
http = "~1"
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
hyper-tls = "~0"
serde_json = "~1.0"
uuid = { version = "~1" }
reqwest = { version = "0.11.22", features = [] }
url = "2.5.0"

[dependencies.rusqlite]
version = "~0.30"
features = ["limits", "bundled"]

[dependencies.db_traits]
path = "../db-traits"
