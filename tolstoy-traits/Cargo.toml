[package]
name = "tolstoy_traits"
version = "0.0.2"
workspace = ".."
edition = "2021"
[lib]
name = "tolstoy_traits"
path = "lib.rs"

[features]
sqlcipher = ["rusqlite/sqlcipher"]

[dependencies]
failure = "~0.1"
failure_derive = "~0.1"
http = "~1.1"
hyper = "~1.5"
serde_json = "~1.0"
uuid = { version = "~1.11" }

[dependencies.rusqlite]
version = "~0.32"
features = ["limits", "bundled"]

[dependencies.db_traits]
path = "../db-traits"
